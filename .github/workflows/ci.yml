name: ci

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark Smoke
        run: bash scripts/benchmark.sh --build-dir build-bench-ci --output build-bench-ci/current.txt --report-json build-bench-ci/report.json

      - name: Upload Benchmark Artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: |
            build-bench-ci/current.txt
            build-bench-ci/report.json
